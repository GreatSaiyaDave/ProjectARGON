<text x="60" y="300" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">DO NOT gut the S23. It is compute, GPS, and battery.</text><text x="60" y="316" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">Glasses are a dumb stereo display + IMU.</text><text x="60" y="332" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">Harvest birdbath engines as sealed units.</text><text x="60" y="348" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">Waveguides cannot be made in a garage.</text><text x="60" y="800" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">WRLDZ / Project ARGON  ·  SCH-01  ·  not to scale  ·  keep engines sealed</text>
