 text-anchor="middle">matched pair  MIPI</text><rect x="680" y="320" width="280" height="100" rx="8" fill="#152033" stroke="#E8C547" stroke-width="2"/><text x="820.0" y="366.0" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">MCU + IMU</text><text x="820.0" y="386.0" fill="#5C6F86" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">3DoF gyro/accel  USB2 HID</text><rect x="360" y="500" width="280" height="110" rx="8" fill="#152033" stroke="#3BE0F0" stroke-width="2"/><text x="500.0" y="551.0" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">LEFT birdbath engine</text><text x="500.0" y="571.0" fill="#5C6F86" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">PBS + curved combiner  ~25 mm</text><rect x="760" y="500" width="280" height="110" rx="8" fill="#152033" stroke="#3BE0F0" stroke-width="2"/><text x="900.0" y="551.0" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">RIGHT birdbath engine</text><text x="900.0" y="571.0" fill="#5C6F86" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">matched  IPD 58–68 mm</text><rect x="560" y="700" width="300" height="100" rx="8" fill="#152033" stroke="#E8C547" stroke-width="2"/><text x="710.0" y="746.0" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Your eyes + real world</text><text x="710.0" y="766.0" fill="#5C6F86" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">optical see-through  ~45° FOV</text>
