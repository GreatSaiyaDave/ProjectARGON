<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
<rect width="100%" height="100%" fill="#0B1220"/>
<rect x="24" y="24" width="1352" height="932" fill="none" stroke="#E8C547" stroke-width="2"/>

<text x="48" y="64" fill="#E8C547" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">SCH-02  OPTICAL PATH  (one eye, side) + BINOCULAR PLAN</text>
<text x="48" y="88" fill="#5C6F86" font-family="DejaVu Sans, sans-serif" font-size="13">Birdbath: OLED down into 45° polarizing beam splitter, folded onto a curved combiner. Depth ≈ 25 mm (Guttag / Nreal Light).</text>
<line x1="48" y1="100" x2="1352" y2="100" stroke="#E8C547" stroke-width="1" opacity="0.4"/>
<text x="80" y="140" fill="#E8C547" font-size="16" font-family="DejaVu Sans, sans-serif">A. SIDE VIEW — RIGHT EYE</text><rect x="180" y="170" width="140" height="18" fill="#FF5AA5" stroke="#F4F0E6" stroke-width="1"/><text x="250" y="164" fill="#F4F0E6" font-size="12" text-anchor="middle" font-family="DejaVu Sans, sans-serif">micro-OLED  (screen down)</text><polygon points="250,210 310,270 250,330 190,270" fill="#1c3348" stroke="#3BE0F0" stroke-width="2"/><line x1="190" y1="270" x2="310" y2="270" stroke="#E8C547" stroke-width="1" stroke-dasharray="4 3"/><text x="250" y="276" fill="#E8C547" font-size="11" text-anchor="middle" font-family="DejaVu Sans, sans-serif">PBS 45°</text><path d="M 250,330 Q 250,430 160,450" fill="none" stroke="#3BE0F0" stroke-width="4"/><text x="300" y="410" fill="#3BE0F0" font-size="12" font-family="DejaVu Sans, sans-serif">curved combiner</text><text x="300" y="426" fill="#5C6F86" font-size="11" font-family="DejaVu Sans, sans-serif">(semi-mirror ~25–30% R)</text><text x="80" y="456" fill="#F4F0E6" font-size="12" font-family="DejaVu Sans, sans-serif">WORLD →</text>
<defs>
  <marker id="ah-140-450" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#F4F0E6"/>
  </marker>
</defs>
<line x1="140" y1="450" x2="200" y2="450" stroke="#F4F0E6" stroke-width="2" marker-end="url(#ah-140-450)"/>
<ellipse cx="430" cy="270" rx="28" ry="18" fill="none" stroke="#E8C547" stroke-width="2"/><circle cx="418" cy="270" r="8" fill="#E8C547"/><text x="470" y="274" fill="#E8C547" font-size="13" font-family="DejaVu Sans, sans-serif">EYE</text><text x="470" y="292" fill="#5C6F86" font-size="11" font-family="DejaVu Sans, sans-serif">relief 12–18 mm</text><line x1="250" y1="188" x2="250" y2="210" stroke="#FF5AA5" stroke-width="2"/><line x1="250" y1="270" x2="402" y2="270" stroke="#FF5AA5" stroke-width="2"/><text x="80" y="520" fill="#F4F0E6" font-size="12" font-family="DejaVu Sans, sans-serif">Black OLED pixels = off = see-through. LCD donors stay milky. AMOLED / micro-OLED only.</text><text x="80" y="540" fill="#F4F0E6" font-size="12" font-family="DejaVu Sans, sans-serif">Combiner blocks ~70–75% of world light (sunglasses). Do not walk in traffic while debugging FOV.</text><line x1="160" y1="188" x2="160" y2="450" stroke="#5C6F86" stroke-width="1"/><text x="70" y="330" fill="#5C6F86" font-size="11" font-family="DejaVu Sans, sans-serif">~25 mm</text><text x="70" y="346" fill="#5C6F86" font-size="11" font-family="DejaVu Sans, sans-serif">stack depth</text><text x="80" y="600" fill="#E8C547" font-size="16" font-family="DejaVu Sans, sans-serif">B. PLAN — BOTH EYES</text><rect x="180" y="640" width="160" height="90" rx="6" fill="#152033" stroke="#3BE0F0" stroke-width="2"/><text x="260" y="690" fill="#F4F0E6" font-size="13" text-anchor="middle" font-family="DejaVu Sans, sans-serif">L engine</text><rect x="520" y="640" width="160" height="90" rx="6" fill="#152033" stroke="#3BE0F0" stroke-width="2"/><text x="600" y="690" fill="#F4F0E6" font-size="13" text-anchor="middle" font-family="DejaVu Sans, sans-serif">R engine</text><line x1="340" y1="685" x2="520" y2="685" stroke="#E8C547" stroke-width="2"/><text x="430" y="670" fill="#E8C547" font-size="12" text-anchor="middle" font-family="DejaVu Sans, sans-serif">IPD 63 mm nom.</text><text x="430" y="720" fill="#5C6F86" font-size="11" text-anchor="middle" font-family="DejaVu Sans, sans-serif">slide 58–68 mm</text><circle cx="260" cy="800" r="16" fill="none" stroke="#E8C547" stroke-width="2"/><circle cx="600" cy="800" r="16" fill="none" stroke="#E8C547" stroke-width="2"/><text x="260" y="840" fill="#5C6F86" font-size="11" text-anchor="middle" font-family="DejaVu Sans, sans-serif">left pupil</text><text x="600" y="840" fill="#5C6F86" font-size="11" text-anchor="middle" font-family="DejaVu Sans, sans-serif">right pupil</text><line x1="260" y1="730" x2="260" y2="784" stroke="#8AA0B8" stroke-width="1" stroke-dasharray="3 3"/><line x1="600" y1="730" x2="600" y2="784" stroke="#8AA0B8" stroke-width="1" stroke-dasharray="3 3"/><text x="900" y="660" fill="#F4F0E6" font-size="13" font-family="DejaVu Sans, sans-serif">FOV ≈ 45–52° diagonal (birdbath class)</text><text x="900" y="682" fill="#F4F0E6" font-size="13" font-family="DejaVu Sans, sans-serif">Do not split a sealed engine. Alignment is the product.</text><text x="900" y="704" fill="#F4F0E6" font-size="13" font-family="DejaVu Sans, sans-serif">Harvest LEFT and RIGHT as a matched pair from one donor.</text><text x="80" y="920" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">WRLDZ / Project ARGON  ·  SCH-02  ·  dimensions typical; measure YOUR donor engines before printing the frame</text>
</svg>
