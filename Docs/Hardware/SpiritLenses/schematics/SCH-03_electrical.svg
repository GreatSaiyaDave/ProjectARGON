<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
<rect width="100%" height="100%" fill="#0B1220"/>
<rect x="24" y="24" width="1352" height="932" fill="none" stroke="#E8C547" stroke-width="2"/>

<text x="48" y="64" fill="#E8C547" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">SCH-03  ELECTRICAL  (functional)   USB-C DisplayPort glasses</text>
<text x="48" y="88" fill="#5C6F86" font-family="DejaVu Sans, sans-serif" font-size="13">S23 Ultra supplies 5 V / ~1 A + DP 1.2/1.4 video + USB 2.0 data. Glasses have no battery.</text>
<line x1="48" y1="100" x2="1352" y2="100" stroke="#E8C547" stroke-width="1" opacity="0.4"/>
<text x="60" y="130" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">This is a FUNCTIONAL schematic of a harvested Xreal/Rokid/RayNeo-class board, not a PCB to etch.</text><text x="60" y="146" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">If the donor DP board is alive: reuse it whole. If dead: buy a replacement LT7911UXC module or HDMI driver pair.</text><rect x="60" y="200" width="200" height="80" rx="8" fill="#E8C547" stroke="#3BE0F0" stroke-width="2"/><text x="160.0" y="236.0" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">USB-C plug</text><text x="160.0" y="256.0" fill="#5C6F86" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">from S23  full-featured cable</text><rect x="320" y="180" width="220" height="50" rx="8" fill="#152033" stroke="#3BE0F0" stroke-width="2"/><text x="430.0" y="201.0" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">VBUS  5 V</text><text x="430.0" y="221.0" fill="#5C6F86" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">≥ 1 A  glasses rail</text><rect x="320" y="245" width="220" height="50" rx="8" fill="#152033" stroke="#3BE0F0" stroke-width="2"/><text x="430.0" y="266.0" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">DP lanes</text><text x="430.0" y="286.0" fill="#5C6F86" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">SSTX/RX  SuperSpeed</text><rect x="320" y="310" width="220" height="50" rx="8" fill="#152033" stroke="#3BE0F0" stroke-width="2"/><text x="430.0" y="331.0" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">USB 2.0 D+/D−</text><text x="430.0" y="351.0" fill="#5C6F86" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">IMU / buttons / audio</text><rect x="320" y="375" width="220" height="50" rx="8" fill="#152033" stroke="#3BE0F0" stroke-width="2"/><text x="430.0" y="396.0" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">CC1 / CC2</text><text x="430.0" y="416.0" fill="#5C6F86" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">orientation + DP alt</text><rect x="620" y="220" width="280" height="120" rx="8" fill="#3BE0F0" stroke="#3BE0F0" stroke-width="2"/><text x="760.0" y="276.0" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">LT7911UXC</text><text x="760.0" y="296.0" fill="#5C6F86" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">DP → 2× MIPI-DSI  + EDID</text><rect x="980" y="160" width="340" height="80" rx="8" fill="#FF5AA5" stroke="#3BE0F0" stroke-width="2"/><text x="1150.0" y="196.0" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">LEFT OLED  MIPI</text><text x="1150.0" y="216.0" fill="#5C6F86" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">Sony ECX343E 1920×1200 or ECX334 1024×768</text><rect x="980" y="280" width="340" height="80" rx="8" fill="#FF5AA5" stroke="#3BE0F0" stroke-width="2"/><text x="1150.0" y="316.0" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">RIGHT OLED  MIPI</text><text x="1150.0" y="336.0" fill="#5C6F86" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">matched panel  same timing</text><rect x="620" y="400" width="280" height="90" rx="8" fill="#E8C547" stroke="#3BE0F0" stroke-width="2"/><text x="760.0" y="441.0" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">MCU</text><text x="760.0" y="461.0" fill="#5C6F86" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">panel init, brightness, 2D/SBS</text><rect x="980" y="400" width="340" height="90" rx="8" fill="#E8C547" stroke="#3BE0F0" stroke-width="2"/><text x="1150.0" y="441.0" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">IMU  6-axis</text><text x="1150.0" y="461.0" fill="#5C6F86" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">BMI / ICM class  USB HID stream</text><rect x="620" y="540" width="280" height="70" rx="8" fill="#152033" stroke="#3BE0F0" stroke-width="2"/><text x="760.0" y="571.0" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">open-ear speakers</text><text x="760.0" y="591.0" fill="#5C6F86" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">optional  DP audio or USB</text><rect x="980" y="540" width="340" height="70" rx="8" fill="#152033" stroke="#3BE0F0" stroke-width="2"/><text x="1150.0" y="571.0" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">proximity / wear sensor</text><text x="1150.0" y="591.0" fill="#5C6F86" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">optional  blanks image off-face</text>
