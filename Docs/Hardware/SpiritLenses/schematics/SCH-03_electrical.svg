<line x1="900" y1="445" x2="980" y2="445" stroke="#3BE0F0" stroke-width="2" marker-end="url(#ah-900-445)"/>
<text x="60" y="660" fill="#E8C547" font-size="15" font-family="DejaVu Sans, sans-serif">USB-C CABLE RULE</text><text x="60" y="684" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">A charge-only cable will make the glasses look dead. Must carry SuperSpeed (DP) + 5 V.</text><text x="60" y="700" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">Use the donor cable first. Then a marked “4K / 60 / video” USB-C cable. Angle plug toward the temple.</text><text x="60" y="716" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">S23: Settings → Connected devices → Samsung DeX → Auto start when HDMI/DP connected = ON for first-light.</text><text x="60" y="732" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">Unity later: render side-by-side (SBS) 3840×1080 (or 3840×1200). Long-press donor brightness+ 3 s for 3D/SBS if the MCU supports it.</text><text x="60" y="800" fill="#E8C547" font-size="15" font-family="DejaVu Sans, sans-serif">IF THE DONOR BOARD IS DEAD</text><text x="60" y="824" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">Path B: two HDMI micro-OLED driver boards (ECX334/335/343, 5 V, &lt;2 W each) + USB-C DP to dual-HDMI splitter.</text><text x="60" y="840" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">Stereo requires a splitter that can SBS-split or two cloned 2D images (no depth). Prefer a living LT7911 board.</text><text x="60" y="856" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">Never power swollen cells. Donor glasses usually have NO pack — host 5 V only. Do not add a pack unless you know BMS.</text><text x="60" y="930" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">WRLDZ / Project ARGON  ·  SCH-03  ·  functional, not a PCB fab drawing</text>
</svg>
