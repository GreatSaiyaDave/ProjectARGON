<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
<rect width="100%" height="100%" fill="#0B1220"/>
<rect x="24" y="24" width="1352" height="932" fill="none" stroke="#E8C547" stroke-width="2"/>

<text x="48" y="64" fill="#E8C547" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">SCH-04  MECHANICAL  FRAME + ENGINE POCKETS</text>
<text x="48" y="88" fill="#5C6F86" font-family="DejaVu Sans, sans-serif" font-size="13">Print the frame around MEASURED donor engines. Numbers below are envelopes — caliper your pair.</text>
<line x1="48" y1="100" x2="1352" y2="100" stroke="#E8C547" stroke-width="1" opacity="0.4"/>
<text x="80" y="140" fill="#E8C547" font-size="16" font-family="DejaVu Sans, sans-serif">A. FRONT  (looking at wearer)</text><rect x="120" y="170" width="520" height="160" rx="80" fill="none" stroke="#E8C547" stroke-width="3"/><rect x="160" y="200" width="180" height="100" rx="8" fill="#152033" stroke="#3BE0F0" stroke-width="2"/><text x="250" y="255" fill="#F4F0E6" font-size="13" text-anchor="middle" font-family="DejaVu Sans, sans-serif">L pocket</text><rect x="420" y="200" width="180" height="100" rx="8" fill="#152033" stroke="#3BE0F0" stroke-width="2"/><text x="510" y="255" fill="#F4F0E6" font-size="13" text-anchor="middle" font-family="DejaVu Sans, sans-serif">R pocket</text><line x1="250" y1="350" x2="510" y2="350" stroke="#E8C547" stroke-width="1"/><text x="380" y="370" fill="#E8C547" font-size="12" text-anchor="middle" font-family="DejaVu Sans, sans-serif">IPD 63 ±5 mm (pupil centers)</text><rect x="40" y="210" width="70" height="24" fill="#152033" stroke="#8AA0B8"/><rect x="650" y="210" width="70" height="24" fill="#152033" stroke="#8AA0B8"/><text x="75" y="200" fill="#5C6F86" font-size="11" text-anchor="middle" font-family="DejaVu Sans, sans-serif">L temple</text><text x="685" y="200" fill="#5C6F86" font-size="11" text-anchor="middle" font-family="DejaVu Sans, sans-serif">R temple / USB-C</text><text x="80" y="430" fill="#E8C547" font-size="16" font-family="DejaVu Sans, sans-serif">B. ENGINE ENVELOPE  (measure, then pad 0.4 mm)</text><text x="100" y="460" fill="#F4F0E6" font-size="13" font-family="DejaVu Sans, sans-serif">Typical sealed birdbath engine</text><text x="520" y="460" fill="#3BE0F0" font-size="13" font-family="DejaVu Sans, sans-serif">48 × 28 × 22 mm  W×D×H  (VERIFY)</text><text x="100" y="488" fill="#F4F0E6" font-size="13" font-family="DejaVu Sans, sans-serif">Optical stack depth</text><text x="520" y="488" fill="#3BE0F0" font-size="13" font-family="DejaVu Sans, sans-serif">~25 mm  OLED → combiner</text><text x="100" y="516" fill="#F4F0E6" font-size="13" font-family="DejaVu Sans, sans-serif">Eye relief</text><text x="520" y="516" fill="#3BE0F0" font-size="13" font-family="DejaVu Sans, sans-serif">12–18 mm  combiner to cornea</text><text x="100" y="544" fill="#F4F0E6" font-size="13" font-family="DejaVu Sans, sans-serif">Temple USB-C</text><text x="520" y="544" fill="#3BE0F0" font-size="13" font-family="DejaVu Sans, sans-serif">right or left  angled cable  strain-relief 15 mm</text><text x="100" y="572" fill="#F4F0E6" font-size="13" font-family="DejaVu Sans, sans-serif">Nose bridge</text><text x="520" y="572" fill="#3BE0F0" font-size="13" font-family="DejaVu Sans, sans-serif">print 3 heights  8 / 12 / 16 mm</text><text x="100" y="600" fill="#F4F0E6" font-size="13" font-family="DejaVu Sans, sans-serif">Strap points</text><text x="520" y="600" fill="#3BE0F0" font-size="13" font-family="DejaVu Sans, sans-serif">ski-goggle pins at temple rear  4 mm holes</text><text x="100" y="628" fill="#F4F0E6" font-size="13" font-family="DejaVu Sans, sans-serif">Clearance to brows</text><text x="520" y="628" fill="#3BE0F0" font-size="13" font-family="DejaVu Sans, sans-serif">≥ 6 mm  foam strip</text><text x="80" y="700" fill="#E8C547" font-size="16" font-family="DejaVu Sans, sans-serif">C. PRINT + FIT</text><text x="100" y="728" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">1. Caliper both donor engines. They are often NOT identical left/right (cable exits differ).</text><text x="100" y="744" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">2. Model pockets in CAD: engine + 0.4 mm slop, 1.5 mm walls, M2 heat-set inserts at 4 corners.</text><text x="100" y="760" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">3. Print PETG or ABS (PLA creeps on skin heat). 0.16 mm layers on pockets.</text><text x="100" y="776" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">4. First print: open jig (no temples) — confirm IPD and both eyes fuse a white rectangle.</text><text x="100" y="792" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">5. Only then add temples, USB-C strain, foam, Millennium-Eye shell cosmetics.</text><text x="100" y="808" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">6. Do not glue combiners. Engines drop in and screw down so you can service FPC cables.</text><text x="80" y="930" fill="#F4F0E6" font-family="DejaVu Sans, sans-serif" font-size="12">WRLDZ / Project ARGON  ·  SCH-04  ·  print AFTER donor engines are on the bench</text>
</svg>
